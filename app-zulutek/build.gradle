plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.zulutek.preview'
    compileSdk 34

    def zuluKs = rootProject.file('signing/zulu.p12')
    signingConfigs {
        if (zuluKs.exists()) {
            zulu {
                storeFile zuluKs
                storeType 'PKCS12'
                storePassword 'zuluzulu2000'
                keyAlias 'zulu'
                keyPassword 'zuluzulu2000'
            }
        }
    }

    defaultConfig {
        applicationId "com.zulutek.preview"
        minSdk 24
        targetSdk 33
        versionCode 1
        versionName "0.1"
        resValue "string", "build_sha", (project.findProperty("BUILD_SHA") ?: "local")

        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17', '-DZTEK_LUXE_BUF'   // OPTIONS > LUXE (APK only): DLY_N x4, RV_N x2
                arguments '-DANDROID_STL=c++_shared'
            }
        }
    }
    externalNativeBuild {
        cmake { path "src/main/cpp/CMakeLists.txt" }
    }
    buildFeatures { prefab true }
    applicationVariants.all { variant ->
        variant.outputs.all {
            outputFileName = "ZuluTek-${variant.buildType.name}.apk"   // ne pas confondre avec les autres APK "zulu"
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }

    buildTypes {
        debug {
            signingConfig signingConfigs.findByName('zulu') ?: signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.findByName('zulu')
            minifyEnabled false
        }
    }
}

dependencies {
    implementation 'com.google.oboe:oboe:1.10.0'
}
