name: Build APK
permissions:
  contents: write


on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Générer les visuels PNG (pixel art)
        run: python3 tools/make_icon.py

      - name: Construire les APK de test
        run: gradle assembleDebug --no-daemon -PBUILD_SHA=$(echo $GITHUB_SHA | cut -c1-8)

      - name: Publier les APK
        uses: actions/upload-artifact@v4
        with:
          name: zulu-apk-${{ github.run_number }}
          path: |
            app/build/outputs/apk/debug/*.apk
            app-linktest/build/outputs/apk/debug/*.apk
            app-drums/build/outputs/apk/debug/*.apk
            app-zulutek/build/outputs/apk/debug/*.apk

      - name: Release APK ZuluTek (SHA visible dans le nom du fichier)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA8=$(echo $GITHUB_SHA | cut -c1-8)
          cp app-zulutek/build/outputs/apk/debug/ZuluTek-debug.apk ZuluTek-debug-$SHA8.apk
          gh release create apk-$SHA8 ZuluTek-debug-$SHA8.apk --title "ZuluTek $SHA8" --notes "APK du commit $SHA8. Le badge B$SHA8 s'affiche 6 s au lancement du LCD." --latest
