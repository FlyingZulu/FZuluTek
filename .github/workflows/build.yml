name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Construire les APK de test
        run: gradle assembleDebug --no-daemon

      - name: Publier les APK
        uses: actions/upload-artifact@v4
        with:
          name: zulu-apk-${{ github.run_number }}
          path: |
            app/build/outputs/apk/debug/*.apk
            app-linktest/build/outputs/apk/debug/*.apk
            app-drums/build/outputs/apk/debug/*.apk
