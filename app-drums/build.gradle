plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.zulu.drums'
    compileSdk 34

    def zuluKs = rootProject.file('signing/zulu.p12')
    signingConfigs {
        if (zuluKs.exists()) {
            zulu {
                storeFile zuluKs
                storeType 'PKCS12'
                storePassword 'zuluzulu2000'
                keyAlias 'zulu'
                keyPassword 'zuluzulu2000'
            }
        }
    }

    defaultConfig {
        applicationId "com.zulu.drums"
        minSdk 21
        targetSdk 33
        versionCode 1
        versionName "0.1"
        ndk { abiFilters 'armeabi-v7a', 'arm64-v8a' }
        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17'
                arguments '-DANDROID_STL=c++_shared'
            }
        }
    }
    externalNativeBuild {
        cmake { path "../app/src/main/cpp/CMakeLists.txt" }
    }
    buildFeatures { prefab true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }

    buildTypes {
        debug {
            signingConfig signingConfigs.findByName('zulu') ?: signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.findByName('zulu')
            minifyEnabled false
        }
    }
}

dependencies {
    implementation 'com.google.oboe:oboe:1.10.0'
}
