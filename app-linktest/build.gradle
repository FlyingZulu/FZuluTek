plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.zulu.linktest'
    compileSdk 34

    signingConfigs {
        zulu {
            storeFile rootProject.file('signing/zulu.p12')
            storeType 'PKCS12'
            storePassword 'zuluzulu2000'
            keyAlias 'zulu'
            keyPassword 'zuluzulu2000'
        }
    }

    defaultConfig {
        applicationId "com.zulu.linktest"
        minSdk 21
        targetSdk 33
        versionCode 1
        versionName "0.1"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }

    buildTypes {
        debug {
            signingConfig signingConfigs.zulu
        }
        release {
            signingConfig signingConfigs.zulu
            minifyEnabled false
        }
    }
}

dependencies {
}
