  <rect x="20" y="470" width="640" height="24" rx="6" fill="#151a22" stroke="#232a36"/>
  <text x="30" y="486" fill="#5a6a80" font-size="9">journal samples…</text>

  <text x="20" y="515" fill="#7dffa8" font-size="10">• comme aujourd'hui mais : grille 16, faders remontés, ZU/LU central, marge haut, XY réduit</text>
