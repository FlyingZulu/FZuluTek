      <rect x="614" y="198" width="120" height="64" rx="6"/><rect x="742" y="198" width="120" height="64" rx="6"/><rect x="870" y="198" width="120" height="64" rx="6"/><rect x="998" y="198" width="120" height="64" rx="6"/>
      <rect x="614" y="270" width="120" height="64" rx="6"/><rect x="742" y="270" width="120" height="64" rx="6"/><rect x="870" y="270" width="120" height="64" rx="6"/><rect x="998" y="270" width="120" height="64" rx="6"/>
      <rect x="614" y="342" width="120" height="56" rx="6"/><rect x="742" y="342" width="120" height="56" rx="6"/><rect x="870" y="342" width="120" height="56" rx="6"/><rect x="998" y="342" width="120" height="56" rx="6"/>
