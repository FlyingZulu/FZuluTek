<svg xmlns="http://www.w3.org/2000/svg" width="1170" height="540" viewBox="0 0 1170 540" font-family="monospace">
  <rect width="1170" height="540" fill="#101216"/>
  <text x="585" y="30" fill="#ece4c4" font-size="20" text-anchor="middle" font-weight="bold">VARIANTE A — ligne de controle horizontale en haut (issue #7 relue)</text>

  <!-- top control row -->
  <g font-size="12" fill="#cfd6e4" text-anchor="middle">
    <rect x="20" y="50" width="86" height="34" rx="6" fill="#1b2733" stroke="#3a4a5e"/>
    <text x="63" y="71">FX</text>
    <rect x="112" y="50" width="86" height="34" rx="6" fill="#1b2733" stroke="#3a4a5e"/>
    <text x="155" y="71">TOOLS</text>
    <rect x="204" y="50" width="86" height="34" rx="6" fill="#1b2733" stroke="#3a4a5e"/>
    <text x="247" y="71">REC</text>
    <rect x="296" y="50" width="86" height="34" rx="6" fill="#1b2733" stroke="#3a4a5e"/>
    <text x="339" y="71">UNDO</text>
    <rect x="388" y="50" width="86" height="34" rx="6" fill="#1b2733" stroke="#3a4a5e"/>
    <text x="431" y="71">MENU</text>
  </g>

  <!-- VU/BPM panel top right + PLAY -->
  <rect x="1010" y="46" width="140" height="44" rx="6" fill="#0d1b14" stroke="#2e5e46"/>
  <text x="1030" y="66" fill="#7dffa8" font-size="10">VU IN  ▮▮▮▯▯</text>
  <text x="1030" y="80" fill="#7dffa8" font-size="10">VU OUT ▮▮▮▮▯</text>
  <text x="1115" y="66" fill="#ffd24a" font-size="11">128.0</text>
  <text x="1115" y="80" fill="#ffd24a" font-size="9">BPM</text>
  <rect x="940" y="50" width="60" height="36" rx="6" fill="#1b2733" stroke="#3a4a5e"/>
  <text x="970" y="72" fill="#cfd6e4" font-size="12" text-anchor="middle">PLAY</text>

  <!-- XY pad (reduced height, detached from top and edges) -->
  <rect x="20" y="100" width="640" height="310" rx="10" fill="#151a22" stroke="#3a4a5e"/>
  <text x="340" y="250" fill="#5a6a80" font-size="13" text-anchor="middle">ÉCRAN XY (un peu moins haut)</text>
  <text x="340" y="270" fill="#5a6a80" font-size="10" text-anchor="middle">toasts + aide ici</text>

  <!-- edge column: F, Z, SHIFT, MUTE -->
  <g font-size="11" fill="#cfd6e4" text-anchor="middle">
    <rect x="672" y="150" width="52" height="34" rx="6" fill="#1b2733" stroke="#3a4a5e"/>
    <text x="698" y="171">F</text>
    <rect x="672" y="192" width="52" height="34" rx="6" fill="#1b2733" stroke="#3a4a5e"/>
    <text x="698" y="213">Z</text>
    <rect x="672" y="234" width="52" height="34" rx="6" fill="#1b2733" stroke="#3a4a5e"/>
    <text x="698" y="255">SHIFT</text>
    <rect x="672" y="276" width="52" height="34" rx="6" fill="#1b2733" stroke="#3a4a5e"/>
    <text x="698" y="297">MUTE</text>
  </g>

  <!-- 16-pad sample grid (4x4) -->
  <g>
    <rect x="736" y="100" width="414" height="310" rx="10" fill="#151a22" stroke="#3a4a5e"/>
    <text x="943" y="92" fill="#8a93a8" font-size="10" text-anchor="middle">GRILLE 16 PADS (banques 1-9 en haut du panneau d'édition)</text>
    <!-- row of bank color chips -->
    <g>
      <rect x="746" y="108" width="18" height="8" fill="#ff9632"/>
      <rect x="768" y="108" width="18" height="8" fill="#00e5ff"/>
      <rect x="790" y="108" width="18" height="8" fill="#be78ff"/>
      <rect x="812" y="108" width="18" height="8" fill="#46ff82"/>
      <rect x="834" y="108" width="18" height="8" fill="#ff46cd"/>
      <rect x="856" y="108" width="18" height="8" fill="#ffdc3c"/>
      <rect x="878" y="108" width="18" height="8" fill="#ff5a46"/>
      <rect x="900" y="108" width="18" height="8" fill="#5a8cff"/>
      <rect x="922" y="108" width="18" height="8" fill="#c62a8c"/>
    </g>
    <!-- 16 pads -->
    <g fill="#1f2937" stroke="#3a4a5e">
      <rect x="750" y="126" width="90" height="64" rx="6"/><rect x="848" y="126" width="90" height="64" rx="6"/><rect x="946" y="126" width="90" height="64" rx="6"/><rect x="1044" y="126" width="90" height="64" rx="6"/>
      <rect x="750" y="198" width="90" height="64" rx="6"/><rect x="848" y="198" width="90" height="64" rx="6"/><rect x="946" y="198" width="90" height="64" rx="6"/><rect x="1044" y="198" width="90" height="64" rx="6"/>
      <rect x="750" y="270" width="90" height="64" rx="6"/><rect x="848" y="270" width="90" height="64" rx="6"/><rect x="946" y="270" width="90" height="64" rx="6"/><rect x="1044" y="270" width="90" height="64" rx="6"/>
      <rect x="750" y="342" width="90" height="56" rx="6"/><rect x="848" y="342" width="90" height="56" rx="6"/><rect x="946" y="342" width="90" height="56" rx="6"/><rect x="1044" y="342" width="90" height="56" rx="6"/>
    </g>
    <text x="795" y="162" fill="#5a6a80" font-size="10" text-anchor="middle">1</text>
    <text x="893" y="162" fill="#5a6a80" font-size="10" text-anchor="middle">2</text>
    <text x="991" y="162" fill="#5a6a80" font-size="10" text-anchor="middle">3</text>
    <text x="1089" y="162" fill="#5a6a80" font-size="10" text-anchor="middle">4</text>
  </g>

  <!-- MIX / FLY faders slightly raised -->
  <g stroke="#3a4a5e" fill="#151a22">
    <rect x="20" y="424" width="300" height="34" rx="8"/>
    <rect x="360" y="424" width="300" height="34" rx="8"/>
  </g>
  <text x="170" y="445" fill="#8a93a8" font-size="10" text-anchor="middle">MIX — remonté</text>
  <circle cx="120" cy="441" r="10" fill="#46ff82"/>
  <text x="510" y="445" fill="#8a93a8" font-size="10" text-anchor="middle">FLY — remonté</text>
  <circle cx="460" cy="441" r="10" fill="#46ff82"/>

  <!-- ZU/LU central fader -->
  <g stroke="#3a4a5e" fill="#151a22">
    <rect x="700" y="424" width="450" height="34" rx="8"/>
  </g>
  <rect x="700" y="424" width="70" height="34" rx="6" fill="#1b2733" stroke="#3a4a5e"/>
  <text x="735" y="445" fill="#cfd6e4" font-size="11" text-anchor="middle">ZU</text>
  <rect x="1080" y="424" width="70" height="34" rx="6" fill="#1b2733" stroke="#3a4a5e"/>
  <text x="1115" y="445" fill="#cfd6e4" font-size="11" text-anchor="middle">LU</text>
  <circle cx="925" cy="441" r="10" fill="#ffdc3c"/>
  <text x="925" y="472" fill="#5a6a80" font-size="9" text-anchor="middle">fader ZU/LU : long, fin, position centrale-décalée</text>

  <!-- sample log -->
  <rect x="20" y="470" width="640" height="24" rx="6" fill="#151a22" stroke="#232a36"/>
  <text x="30" y="486" fill="#5a6a80" font-size="9">journal samples…</text>

  <!-- annotations -->
  <text x="20" y="515" fill="#7dffa8" font-size="10">• marge en haut : les boutons ne touchent plus le bord, ni l'écran XY</text>
  <text x="20" y="530" fill="#7dffa8" font-size="10">• FX TOOLS REC UNDO MENU = ligne horizontale · F Z SHIFT MUTE = colonne verticale</text>
</svg>
